services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/telemetry_mysql.sql:/docker-entrypoint-initdb.d/01-telemetry.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app_net
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "librespeed.mysql"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        LIBRESPEED_VERSION: v6.2.0
    image: librespeed-project:6.2.0
    restart: unless-stopped
    environment:
      MODE: frontend
      TELEMETRY: "true"
      ENABLE_ID_OBFUSCATION: "true"
      OBFUSCATION_SALT: ${OBFUSCATION_SALT}
      REDACT_IP_ADDRESSES: "false"
      PASSWORD: ${STATS_PASSWORD}
      GDPR_EMAIL: ${GDPR_EMAIL}
      USE_NEW_DESIGN: "true"
      DB_TYPE: mysql
      DB_HOSTNAME: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - app_www:/var/www/html
      - ./servers.json:/servers.json:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/index.html && test -f /var/www/html/results/telemetry.php"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - app_net
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "librespeed.app"

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - app_www:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app_net
    logging:
      driver: fluentd
      options:
        fluentd-address: "localhost:24224"
        fluentd-async: "true"
        tag: "librespeed.nginx"

volumes:
  mysql_data:
  app_www:

networks:
  app_net:
    driver: bridge
